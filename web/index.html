<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>simple-jev plays MARS RAID</title>
<style>
  :root{
    --bg:#140d0b; --panel:#221512; --panel-2:#1a100e; --line:#43261f;
    --ink:#f0e4df; --dim:#b08c80; --amber:#f2b134; --green:#3fbf7f; --red:#e5533d; --blue:#4aa3df; --violet:#c678dd;
    --mono:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  /* The page itself never scrolls: the stage fills the space it is given and the sidebar scrolls inside
     its own column, so on a 4K display the game gets the real estate instead of a 900px letterbox. */
  body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--mono);overflow:hidden}
  /* m.js renders the component inside a wrapper div, so the flex chain has to pass through it or the
     stage has no height to fill. */
  #app,#app>div{height:100%;min-height:0;display:flex;flex-direction:column}
  header{padding:13px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  h1{font-size:16px;font-weight:600}
  .sub{color:var(--dim);font-size:12px}
  .grow{flex:1}
  button{font:inherit;font-size:12px;color:var(--ink);background:var(--panel);border:1px solid var(--line);
    border-radius:4px;padding:5px 12px;cursor:pointer}
  button:hover:not(:disabled){background:#2e1c17;border-color:var(--amber)}
  button:disabled{opacity:.4;cursor:default}
  button.on{border-color:var(--green);color:var(--green)}
  main{flex:1 1 auto;min-height:0;display:flex;gap:16px;padding:16px;align-items:stretch}
  /* flex:1 1 0 + min-width:0 lets the stage grow into all remaining width; the game recomputes
     camera.aspect from its own innerWidth/innerHeight on resize, so any shape is fine. */
  #stage{flex:1 1 0;min-width:0;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:#000}
  #stage iframe{display:block;width:100%;height:100%;border:0}
  aside{flex:0 0 clamp(360px,26vw,620px);min-width:0;min-height:0;overflow-y:auto;
        display:flex;flex-direction:column;gap:13px;padding-right:4px}
  /* Narrow screens: stack, and give the game a sensible fixed share of the height. */
  @media (max-width:1100px){
    body{overflow:auto}
    #app,#app>div{height:auto}
    main{flex-direction:column;align-items:stretch}
    #stage{flex:0 0 auto;height:min(60vh,520px)}
    aside{flex:0 0 auto;overflow:visible}
  }
  /* Overlay-style scrollbars: narrow, rounded, dark, and only visible against the track on hover. */
  *{scrollbar-width:thin;scrollbar-color:#5c3a30 transparent}
  ::-webkit-scrollbar{width:8px;height:8px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:#4a2e26;border-radius:99px;border:2px solid transparent;background-clip:content-box}
  ::-webkit-scrollbar-thumb:hover{background:#6d453a;background-clip:content-box}
  ::-webkit-scrollbar-corner{background:transparent}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:12px 14px}
  .k{color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.07em;margin-bottom:9px}
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
  .stat b{display:block;font-size:19px;font-weight:600}
  .stat span{color:var(--dim);font-size:11px}
  .row{display:flex;align-items:flex-start;gap:9px;margin:7px 0}
  .bar{flex:0 0 110px;height:12px;background:var(--panel-2);border-radius:3px;overflow:hidden;margin-top:4px}
  .bar i{display:block;height:100%;transition:width .12s linear}
  .val{flex:0 0 38px;text-align:right;color:var(--dim);font-size:12px;margin-top:2px}
  .txt{flex:1;font-size:12.5px;color:#e2cfc8}
  .txt em{display:block;color:var(--dim);font-style:normal;font-size:11px;margin-top:1px}
  .row.win .txt{color:var(--green)}
  #premise{color:var(--dim);font-size:12.5px;white-space:pre-wrap;max-height:170px;overflow:auto}
  .warn{color:var(--red)}
  .muted{color:var(--dim)}
  ol{margin:0;padding-left:18px;color:var(--dim);font-size:12px}
  .legend{display:flex;gap:14px;font-size:11px;color:var(--dim);margin-top:6px}
  .legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px}
  svg{display:block;width:100%;height:150px}
</style>
</head>
<body>
<div id="app"></div>

<script type="module">
// Dev cache-bust: browsers hold ES modules across soft navigations even under no-store, so edits would
// silently not take effect.
const v = '?v=' + Date.now();
const M = (await import('./vendor/m.min.js' + v)).default;
const { Agent } = await import('./app.js' + v);

// M.mount() returns the reactive root instance but never calls init() on it -- only x-data and
// x-component scopes get that automatically.
const app = M.mount('#app', () => Agent(M));
app.init();
</script>
</body>
</html>
