folders:
- name: Expenses
  description: This is a receipt, invoice, order confirmation or record of a purchase, with an amount of money involved.
  label: purchase receipt
- name: Statements
  description: This is a periodic account statement from a bank, credit card or mortgage lender.
  label: bank statement
- name: Income
  description: 'This reports money arriving: a paycheck, a direct deposit, or a payment from a tenant.'
  label: paycheck or deposit received
- name: Stock
  description: 'This comes from a brokerage about stock or crypto: a trade confirmation, a position, or an account notice.'
  label: brokerage or crypto trade
- name: Taxes
  description: This concerns tax filing or tax returns, from a tax authority or tax preparation software.
  label: tax filing
- name: Travel
  description: 'This is about a trip: a flight, hotel, rental car, reservation, ticket or passport.'
  label: trip booking
- name: Newsletters
  description: 'This is a periodical the recipient subscribed to and reads at leisure: a digest, a roundup, or an issue of
    a publication.'
  label: newsletter
- name: Opportunities
  description: A recruiter or hiring manager writes personally to this individual by name about a specific job.
  label: recruiter job offer
- name: Job Applications
  description: 'An applicant tracking system acknowledges a job application: "application received", "thank you for your interest".'
  label: job application receipt
- name: Job Interviews
  description: 'A company or recruiter follows up about an interview: scheduling it, confirming it, or describing next steps.'
  label: interview scheduling
- name: Job/Ancestry
  description: This addresses the recipient as an employee of Ancestry, about internal company matters.
  label: Ancestry internal company mail
- name: Job/Blizzard
  description: This addresses the recipient as an employee of Blizzard Entertainment, about internal company matters.
  label: Blizzard internal company mail
- name: Job/CrowdStrike
  description: This addresses the recipient as an employee of CrowdStrike, about internal company matters.
  label: CrowdStrike internal company mail
- name: Job/HSA
  description: 'This is about a health savings account: contributions, claims, balances or benefits administration.'
  label: health savings account
- name: eCommerce
  description: 'This is about wholesaling or dropshipping as a business: suppliers, product sourcing, or trade accounts.'
  label: wholesale supplier
- name: Real Estate Investment
  description: 'This is about an investment property deal: a short sale, foreclosure, wholesale assignment or land purchase.'
  label: property deal
- name: Kids
  description: This is addressed to one of the recipient's children rather than to the recipient.
  label: message for a child
- name: Myself
  description: The recipient sent this message to their own address from a work account.
  label: note to self
operations:
- op: delete
  description: This is a promotional advertisement from a shop, offering a sale, a discount, a deal or reward points.
  label: advertisement
- op: skip
  description: This needs the operator to read it and decide personally, because it concerns something only they can judge.
  label: needs a personal decision
- op: archive
  description: This is ordinary correspondence that has served its purpose and just needs filing away out of the inbox.
  label: routine correspondence
spam_signals:
- The message promises the reader a large sum of money and asks them to click a link or confirm personal details.
- The message uses urgent capitalised excitement and asks the reader to act immediately on an unexpected windfall.
- The sender is unknown to the recipient and the message asks for bank, password or payment information.
